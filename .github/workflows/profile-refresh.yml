name: Refresh profile repo

# Manual only. Refreshes the repo-status table in the profile README and opens
# a PR there — never pushes to main. Needs a STATUS_TOKEN PAT (GITHUB_TOKEN
# cannot write another repo).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refresh profile table (opens a PR)
        uses: ./.github/actions/profile
        with:
          token: ${{ secrets.STATUS_TOKEN }}
