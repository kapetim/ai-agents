name: CI

# Manual only. Read-only markdownlint; nothing auto-runs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global --no-audit --no-fund markdownlint-cli@0.49.1
      - run: markdownlint '**/*.md'
